# Deployed to /opt/emoji/compose.yml on the VPS by the CI pipeline (scp).
# `docker compose pull && docker compose up -d` from that directory is the
# whole deploy. The `.env` next to this file is placed by hand and is NEVER
# touched by CI.
#
# The reverse proxy is NOT part of this project. Caddy runs as its own Compose
# project at /opt/caddy so that redeploying this app cannot interrupt the other
# sites it serves. This app joins the shared external `proxy` network and Caddy
# reaches it by container name as emoji-app:3000.
services:
  emoji-app:
    image: ghcr.io/absar0920/emoji-project:latest
    container_name: emoji-app
    restart: unless-stopped
    # Runtime secrets (MONGODB_URI, AUTH_SECRET, API keys, …) live here.
    env_file:
      - .env
    # Not published to the host — only Caddy can reach it, over the shared
    # proxy network, as emoji-app:3000.
    expose:
      - "3000"
    networks:
      - proxy
    healthcheck:
      # Node 22 has global fetch; avoids depending on curl/wget in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
