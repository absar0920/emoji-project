# Deployed to /opt/emoji/compose.yml on the VPS by the CI pipeline (scp).
# `docker compose pull && docker compose up -d` from that directory is the
# whole deploy. The `.env` next to this file is placed by hand and is NEVER
# touched by CI.
services:
  emoji-app:
    image: ghcr.io/absar0920/emoji-project:latest
    container_name: emoji-app
    restart: unless-stopped
    # Runtime secrets (MONGODB_URI, AUTH_SECRET, API keys, …) live here.
    env_file:
      - .env
    # Not published to the host — only Caddy can reach it, over the internal
    # network, as emoji-app:3000.
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      # Node 22 has global fetch; avoids depending on curl/wget in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued certs — persist across deploys
      - caddy_config:/config
    depends_on:
      - emoji-app
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
